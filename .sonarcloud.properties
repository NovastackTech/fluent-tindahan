# SonarCloud Automatic Analysis configuration
# https://docs.sonarsource.com/sonarcloud/advanced-setup/automatic-analysis/

# Global exclusions for static analysis
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/build/**,**/coverage/**,**/Migrations/**,**/*.Designer.cs,**/AppDbContextModelSnapshot.cs,**/*.json,**/*.csv,**/*.md,**/*.svg,**/*.png,**/*.ico

# Exclude generated migrations, snapshots, and test fixtures from Copy-Paste Detection (CPD)
# This prevents EF Core database snapshot models and test setup boilerplate from triggering the Duplication Quality Gate
sonar.cpd.exclusions=**/Migrations/**,**/*.Designer.cs,**/AppDbContextModelSnapshot.cs,backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Test definitions
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*Tests.cs,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
