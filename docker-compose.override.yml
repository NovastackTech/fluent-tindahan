# Local-only overrides (auto-merged by `docker compose` on the developer machine).
# Not used on Alibaba SAS (deploy copies only docker-compose.yml + .env).

services:
  db:
    ports:
      - "5432:5432"

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Allow local Development without real PayMongo secrets
      PayMongo__SecretKey: ${PAYMONGO_SECRET_KEY:-sk_test_local}
      PayMongo__WebhookSecret: ${PAYMONGO_WEBHOOK_SECRET:-whsec_test_local}
      PayMongo__FrontendOrigin: ${PAYMONGO_FRONTEND_ORIGIN:-http://localhost:5173}
    ports:
      - "5000:8080"

  web:
    ports:
      - "8080:80"
