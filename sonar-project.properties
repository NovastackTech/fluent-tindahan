# SonarCloud / SonarQube Scanner configuration
sonar.projectKey=NovastackTech_fluent-tindahan
sonar.organization=novastacktech

# Source and Test directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*Tests.cs,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

# Global exclusions for static analysis (excludes test files and generated code from the main source set)
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/build/**,**/coverage/**,**/Migrations/**,**/*.Designer.cs,**/AppDbContextModelSnapshot.cs,**/*.json,**/*.csv,**/*.md,**/*.svg,**/*.png,**/*.ico,**/*.test.ts,**/*.test.tsx,frontend/src/test/**,backend/tests/**

# Exclude generated migrations, snapshots, and test fixtures from Copy-Paste Detection (CPD)
sonar.cpd.exclusions=**/Migrations/**,**/*.Designer.cs,**/AppDbContextModelSnapshot.cs,backend/tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test/**

# Source encoding
sonar.sourceEncoding=UTF-8
