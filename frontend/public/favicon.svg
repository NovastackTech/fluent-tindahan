<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f7b51"/>
      <stop offset="100%" stop-color="#08432b"/>
    </linearGradient>
    <linearGradient id="counterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f7b51"/>
      <stop offset="100%" stop-color="#0c6341"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2"/>

  <!-- Store front body -->
  <rect x="96" y="210" width="320" height="196" rx="20" fill="#f8faf9" filter="url(#shadow)"/>

  <!-- Awning (Canopy) with 5 stripes -->
  <g id="awning" filter="url(#shadow)">
    <!-- Stripe 1 (Green) -->
    <path d="M 76 130 L 140 130 L 140 220 Q 108 236 76 220 Z" fill="#107c41"/>
    <!-- Stripe 2 (Gold) -->
    <path d="M 140 130 L 204 130 L 204 220 Q 172 236 140 220 Z" fill="#ffc32d"/>
    <!-- Stripe 3 (Green) -->
    <path d="M 204 130 L 308 130 L 308 220 Q 256 238 204 220 Z" fill="#107c41"/>
    <!-- Stripe 4 (Gold) -->
    <path d="M 308 130 L 372 130 L 372 220 Q 340 236 308 220 Z" fill="#ffc32d"/>
    <!-- Stripe 5 (Green) -->
    <path d="M 372 130 L 436 130 L 436 220 Q 404 236 372 220 Z" fill="#107c41"/>
    <!-- Awning top header bar -->
    <rect x="70" y="122" width="372" height="14" rx="6" fill="#ffffff" fill-opacity="0.95"/>
  </g>

  <!-- POS Screen Counter -->
  <rect x="136" y="244" width="240" height="136" rx="16" fill="url(#counterGrad)" stroke="#14a069" stroke-width="3"/>

  <!-- Online indicator LED -->
  <circle cx="352" cy="266" r="6" fill="#22c55e"/>

  <!-- Philippine Peso (₱) Symbol inside counter -->
  <!-- Stem -->
  <rect x="220" y="270" width="18" height="88" rx="8" fill="#ffffff"/>
  <!-- Loop -->
  <path d="M 226 270 H 268 C 286 270 298 280 298 296 C 298 312 286 322 268 322 H 226 Z" fill="none" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Double Crossbars -->
  <rect x="206" y="286" width="76" height="8" rx="4" fill="#ffc32d"/>
  <rect x="206" y="306" width="76" height="8" rx="4" fill="#ffc32d"/>
</svg>