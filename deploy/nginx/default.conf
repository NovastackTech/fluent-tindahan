# Fluent Tindahan — nginx reverse proxy for Alibaba SAS / Docker Compose
# Serves the PWA and proxies /api to the .NET Web API container.

upstream fluent_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # API + webhooks → .NET Web API
    location /api/ {
        proxy_pass http://fluent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Hashed build assets from Vite — safe to cache immutably
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # Web App Manifest — short cache so icon and metadata changes propagate promptly
    location ~* \.webmanifest$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # Service Worker and HTML entrypoint — must never be cached immutably
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Non-hashed static files outside /assets/ (e.g. favicon, root icons)
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback (must not swallow /api)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
