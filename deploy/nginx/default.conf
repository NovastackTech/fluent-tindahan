# Fluent Tindahan — nginx reverse proxy for Alibaba SAS / Docker Compose
# Serves the PWA and proxies /api to the .NET Web API container.

upstream fluent_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    # API + webhooks → .NET Web API
    location /api/ {
        proxy_pass http://fluent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Swagger (optional; useful on SAS during bring-up)
    location /swagger {
        proxy_pass http://fluent_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # PWA assets — long cache for hashed bundles; short for SW / index
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback (must not swallow /api)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
